---
# Deploys upstream's own Kubernetes manifests with this project's published
# image. The base is pulled from the upstream repository at the release this
# image was built from (Renovate keeps the two refs below in step with
# version.txt).
#
#   kubectl apply -k deploy/kubernetes/ -n <namespace>
#
# One patch: upstream's upgrade-check init container needs /bin/sh, which the
# distroless image does not carry, so it is removed. Before moving an
# existing instance to a new image tag, run the same pre-flight check
# manually if you want it:
#
#   kubectl run upgrade-check --rm -it --restart=Never \
#     --image=ghcr.io/felddy/prusa-connect:<new-version> \
#     --overrides='{"spec":{"containers":[{"name":"upgrade-check", ... volume
#     mounts matching the deployment ...}]}}' -- upgrade check
#
# or simply snapshot the state and storage claims first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/prusa3d/prusa-connect//deploy/kubernetes?ref=v0.1.0-beta.1

images:
  - name: prusa-connect
    newName: ghcr.io/felddy/prusa-connect
    newTag: 0.1.0-beta.1

patches:
  - target:
      kind: Deployment
      name: prusa-connect
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
