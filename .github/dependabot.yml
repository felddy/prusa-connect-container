---
# Any ignore directives should be uncommented in downstream projects to disable
# Dependabot updates for the given dependency. Downstream projects will get
# these updates when the pull request(s) in the appropriate skeleton are merged
# and Lineage processes these changes.

version: 2

updates:
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    # The node and golang stages mirror upstream's toolchain pins; digest
    # and patch updates flow, but version-line jumps follow upstream's
    # Dockerfile, not Dependabot.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "docker :whale:"
    groups:
      docker-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "docker :whale:"
    groups:
      docker-compose-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "github-actions :octocat:"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "python :snake:"
    groups:
      uv-all:
        applies-to: version-updates
        patterns:
          - "*"
