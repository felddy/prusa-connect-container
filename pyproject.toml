[project]
name = "prusa-connect-container"
version = "0.0.0"
description = "Test/tooling environment for the Prusa Connect container image"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
    "docker",
    "pre-commit",
    "pytest",
    "requests",
]
dev = ["mypy", { include-group = "test" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--capture=no --color=yes --runslow --verbose -rA"
log_cli = true
log_cli_level = "INFO"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
